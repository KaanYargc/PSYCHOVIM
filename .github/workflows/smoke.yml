name: smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  neovim:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PSYCHOVIM_MAINTENANCE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell
        run: |
          bash -n install.sh
          bash -n bin/pycho
          bash -u bin/pycho help >/dev/null

      - name: Launcher opens PychoVIM before updater
        run: |
          cat > /tmp/pychovim-fake-nvim <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "${PSYCHOVIM_AUTOUPDATE_REQUEST:-}" > /tmp/pychovim-auto-request
          printf '%s\n' "$*" > /tmp/pychovim-launch-args
          EOF
          chmod +x /tmp/pychovim-fake-nvim
          output="$(PSYCHOVIM_MAINTENANCE=0 PSYCHOVIM_NVIM=/tmp/pychovim-fake-nvim bash bin/pycho sample.lua)"
          test -z "$output"
          grep -qx '1' /tmp/pychovim-auto-request
          grep -qx 'sample.lua' /tmp/pychovim-launch-args

      - name: Product policy contracts
        run: |
          grep -q 'apply_default_editor_policy' install.sh
          grep -q '</dev/tty >/dev/tty' install.sh
          ! grep -Rqi 'restore default editor' lua bin install.sh
          grep -q 'opts.dashboard.width = 58' lua/psychovim/plugin_overrides.lua
          grep -q 'section = "keys", gap = 1, padding = 1' lua/psychovim/plugin_overrides.lua

      - name: Marketplace source contract
        run: |
          grep -q 'dotfyle.com' lua/psychovim/dotfyle.lua
          grep -q '/trpc' lua/psychovim/dotfyle.lua
          grep -q 'source = "Dotfyle"' lua/psychovim/marketplace.lua
          ! grep -Rqi 'api.github.com/search/repositories' lua/psychovim/marketplace.lua lua/psychovim/dotfyle.lua

      - name: Set up Neovim engine
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep gcc lua5.1 nodejs npm unzip xdg-utils

      - name: Parse Lua files
        run: find lua -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Mount config
        run: |
          mkdir -p "$HOME/.config"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.config/nvim"

      - name: Install extensions
        run: |
          for attempt in 1 2 3; do
            if nvim --headless "+Lazy! sync" +qa; then
              exit 0
            fi
            echo "lazy sync retry $attempt/3"
            sleep $(( attempt * 2 ))
          done
          exit 1

      - name: Smoke core
        run: |
          nvim --headless \
            "+lua require('psychovim.theme').apply('sanity')" \
            "+lua assert(type(require('psychovim.pycho_actions').save) == 'function')" \
            "+lua assert(type(require('psychovim.pycho_close').open) == 'function')" \
            "+lua local s=require('psychovim.settings'); assert(type(s.get) == 'function'); assert(s.get('auto_update_config') ~= nil); assert(s.get('tab_width') ~= nil); assert(s.get('linting') ~= nil); assert(s.get('terminal_numbers') ~= nil); assert(s.get('lsp_python') ~= nil)" \
            +qa

      - name: Smoke Dotfyle client
        run: |
          nvim --headless \
            "+lua local d=require('psychovim.dotfyle'); local u=d._direct_url('searchPlugins',{query='telescope',categories={},sorting='popular',page=1,take=10}); assert(u:find('https://dotfyle.com/trpc/searchPlugins',1,true)); assert(u:find('%22json%22',1,true))" \
            "+lua local d=require('psychovim.dotfyle'); local p,e=d._unwrap({result={data={json={data={{owner='nvim-telescope',name='telescope.nvim'}},meta={total=1}}}}}); assert(not e); assert(p.data[1].owner=='nvim-telescope'); local b,be=d._unwrap({{result={data={json={data={},meta={total=0}}}}}}); assert(not be and b.meta.total==0)" \
            "+lua local d=require('psychovim.dotfyle'); local old=d.query; d.query=function(proc,input,done) assert(proc=='searchPlugins'); assert(input.categories[1]=='colorscheme'); done({data={{owner='folke',name='tokyonight.nvim',category='colorscheme',stars=1,configCount=2}},meta={total=1,currentPage=1,lastPage=1}}) end; local hit=false; d.search({kind='theme'},function(rows,err,meta) assert(not err and rows[1].kind=='theme' and meta.total==1); hit=true end); assert(hit); d.query=old" \
            +qa

      - name: Smoke extensions
        run: |
          nvim --headless \
            "+lua local m=require('psychovim.marketplace'); assert(type(m.specs) == 'function'); assert(type(m.apply_active_theme) == 'function'); assert(type(m.search) == 'function'); assert(m.source == 'Dotfyle'); assert(m.source_url == 'https://dotfyle.com/neovim/configurations/plugins')" \
            "+lua assert(vim.fn.exists(':PychoMarketplace') == 2)" \
            "+lua assert(vim.fn.exists(':PychoExtensions') == 2)" \
            "+lua assert(vim.fn.exists(':PychoInventory') == 2)" \
            +qa

      - name: Smoke updater and system
        run: |
          nvim --headless \
            "+lua local d=require('psychovim.default_editor'); assert(type(d.status) == 'function'); assert(type(d.enforce) == 'function')" \
            "+lua assert(type(require('psychovim.updater').run) == 'function')" \
            "+lua assert(vim.fn.exists(':PychoUpdate') == 2)" \
            "+lua assert(vim.fn.exists(':PychoUpdater') == 2)" \
            +qa

      - name: Smoke tooling
        run: |
          nvim --headless \
            "+lua assert(vim.fn.exists(':MasonToolsInstallSync') == 2)" \
            "+lua assert(require('lazy.core.config').plugins['nvim-lint'] ~= nil)" \
            +qa

      - name: Smoke project features
        run: |
          nvim --headless \
            "+lua assert(type(require('psychovim.dorsia').open) == 'function')" \
            "+lua assert(type(require('psychovim.business_card').open) == 'function')" \
            +qa